# Converted from the run of the same name, made before the YAML input (3-4 Oct 2026).
base: base.yaml
name: co3_ice_p_0.0059
label: "CO:H2O ice on gold, 3 um, 36 mJ, 0.0059 cm2, p-pol"

laser:
  wavelength_um: 3
  macropulse_energy_mJ: 36
  spot_area_cm2: 0.0059

stack:                              # vacuum side first
  - {material: amorphous_ice, thickness_nm: 87.7,      # 87.7 +- 1.2 nm (Jones et al. 2026, main text)
     # amorphous H2O ice at 10 K, 3333.3 cm-1 (Hudson et al. 2025), measured on the porous film itself
     refractive_index: {n: 1.1653, k: 0.4018, includes_pores: true}}
  - {material: gold_film, thickness_nm: 100}
  - {material: copper_ofhc, thickness_nm: 3.175e6}

numerics:
  max_time_step_us: 0.05              # uncapped, the steps after the pulse train grow to 27 us
output:
  profile_times_us: [0.001, 0.01, 0.1, 0.5, 1, 1.5, 2, 2.5, 3, pulse_train_end, 10, 20, 50, 100]
